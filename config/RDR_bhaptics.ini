; RDR_bhaptics settings. This file lives in <game folder>\RDR_bhaptics\ next to bhaptics_library.dll.

[General]
Enabled=1
; 1 = more detail in RDR_bhaptics.log (every shot, hit and its angle). For testing and calibration.
DebugLog=0

[bHaptics]
; Leave empty: the mod's own workspace is built in. Only for testing patterns from another workspace.
AppId=
ApiKey=

[Hands]
; Which arm shots and reloads play on: Auto, Right or Left.
; Auto follows RDRVR's [Controls] LeftHanded (its menu's choice in %LOCALAPPDATA%\RDRVR\RDRVR.user.ini, else its
; RDRVR.ini in the game folder), and is right-handed without RDRVR.
Hand=Auto
; Long guns (rifles, shotguns) play their two-handed recoil (RecoilRifle_TwoHanded_R etc.): Auto, On or Off.
; Auto follows RDRVR's foregrip hold ([Reload] TwoHanded); off without RDRVR.
TwoHanded=Auto

[Intensity]
; Multipliers for each group of effects. 0 turns a group off.
Recoil=1.0
Impact=1.0
Heartbeat=1.0
Deadeye=1.0
Horse=1.0
; Fire, water, healing
Environment=1.0

[Impact]
; Calibration of the hit direction: degrees added to it, and 1 to mirror left and right.
AngleOffset=0
AngleInvert=0
; Health drops smaller than this are ignored.
MinDamage=0.5

[Health]
; The heartbeat starts below this share of max health.
LowHealthRatio=0.25
; A rise of at least this share of max health at once plays the heal effect (the slow regeneration doesn't).
HealRatio=0.15

[Horse]
; The horse's ground speed (m/s) for the trot and gallop rhythms.
TrotSpeed=3.0
GallopSpeed=7.5
